<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro - Solo Realtime Database</title>
<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=i3-Lg2BIQxTthnYIPGy-ilJXDba6i0G6HnvAJFu24KbS1hvbwd8bJpfG0L6ywOg1iKwQPluTqJcefZjI8uzUnjxMx7TZtSKPyHaErTbZvz4Jns3wysOIBvHBXR9gMAwSksx0C-rZMjFIc2Yg8-uJ4PyMLCTpp6R8a1zb3vm6UADdQjnOmoVuuRMtxQkP5kN1EA8qgpivAaNFX8aRlOt2eE6LFLh-sMAfQERJlXqhnEs60Uw5pGuOxr06wNDhS7AxPdY6GzMSj3zkzwT7OiLTSg" charset="UTF-8"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f6f7f9;padding:12px;padding-bottom:120px}
.card{background:#fff;border-radius:16px;padding:14px;margin-top:12px}
h1{text-align:center;font-size:20px}h1 small{display:block;font-size:11px;letter-spacing:3px;color:#666}
input,textarea{width:100%;padding:15px;font-size:16px;border:2px solid #ddd;border-radius:12px;margin-top:6px;background:#fff}
button{padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:700;width:100%;margin-top:8px}
.btnBlue{background:#1a73e8;color:#fff}.btnGreen{background:#0f9d58;color:#fff}.btnGray{background:#eee;color:#111}
img.prev{width:120px;height:120px;object-fit:cover;border-radius:50%;display:none;margin:10px auto;background:#eee}
img.prevDom{width:100%;height:160px;object-fit:cover;border-radius:12px;display:none;margin-top:8px}
.persona{background:#fff;border-radius:16px;padding:12px;margin-top:12px;display:flex;gap:10px}
.persona img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#ddd}
.persona .dom{width:64px;height:44px;border-radius:8px;object-fit:cover;background:#ddd;display:block;margin-top:4px}
.small{font-size:13px;color:#555}
#modal{position:fixed;inset:0;background:#fff;z-index:9999;overflow-y:auto;padding:14px;display:none}
#modal.open{display:block}
#log{background:#111;color:#0f0;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap;margin-top:10px;min-height:60px}
</style></head><body>
<h1>Joe Rodriguez<small>PHOTOGRAFY</small>Registro Domicilio</h1>
<p style="text-align:center"><span id="status">● Iniciando...</span><br><span id="count">0 registros</span></p>

<div class="card" style="border:2px solid #f57c00">
<b>🔥 Guarda SOLO en Realtime Database</b><br>
<span style="font-size:13px">Proyecto: calificaciones-9f753<br>Rama: <b>/registros/{ID}</b><br>Ahí lo vas a ver en: console.firebase.google.com > Realtime Database</span><br>
<button class="btnBlue" type="button" onclick="probar()" style="background:#f57c00">🔥 PROBAR - Guardar registro PRUEBA en Firebase</button>
<div id="log">Esperando...</div>
</div>

<input id="q" placeholder="🔍 Buscar por nombre, teléfono o dirección...">
<button id="btnNuevoTop" class="btnBlue" type="button">+ NUEVO REGISTRO</button>
<div id="list"></div>

<div id="modal">
<h2 id="mtitle">Nuevo registro</h2>
<button class="btnGray" type="button" onclick="closeM()">✕ Cerrar</button>
<label>Nombre</label><input id="nombre">
<label>Teléfono</label><input id="telefono" inputmode="numeric">
<label>Dirección</label><textarea id="direccion"></textarea>
<label>Notas</label><textarea id="notas"></textarea>
<div class="card"><b>📷 FOTO PERSONA</b><img id="prevP" class="prev">
<label style="display:block;background:#111;color:#fff;padding:15px;border-radius:12px;text-align:center;margin-top:8px">📷 TOMAR FOTO<input type="file" id="filePcam" accept="image/*" capture="user" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></label>
<label style="display:block;background:#eee;padding:15px;border-radius:12px;text-align:center;margin-top:8px">🖼️ GALERÍA<input type="file" id="fileP" accept="image/*" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></label>
</div>
<div class="card"><b>🏠 FOTO DOMICILIO</b><img id="prevD" class="prevDom">
<label style="display:block;background:#111;color:#fff;padding:15px;border-radius:12px;text-align:center;margin-top:8px">🏠 TOMAR FOTO<input type="file" id="fileDcam" accept="image/*" capture="environment" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></label>
<label style="display:block;background:#eee;padding:15px;border-radius:12px;text-align:center;margin-top:8px">🖼️ GALERÍA<input type="file" id="fileD" accept="image/*" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></label>
</div>
<button id="btnGuardar" class="btnGreen" type="button">✅ GUARDAR REGISTRO</button>
<p id="saveMsg" style="text-align:center;font-size:13px"></p>
<button class="btnGray" type="button" onclick="closeM()">Cancelar</button>
</div>
<button id="fab" type="button" style="position:fixed;right:16px;bottom:16px;width:auto;padding:16px 22px;background:#1a73e8;color:#fff;border-radius:999px">+ Nuevo</button>

<script>
function el(id){ return document.getElementById(id); }
function val(id){ var e=el(id); return e ? (e.value||'').trim() : ''; }
function log(t){ var l=el('log'); if(l) l.textContent += '\n'+t; console.log(t); }
var _PARTS=["eyJhcGlLZXkiOiAiQUl6YVN5QzRGVm9rSEZSYmJU",
"YzRyQmlmTnl0NWJ2T1gyQ3V6a1d3IiwgImF1dGhE",
"b21haW4iOiAiY2FsaWZpY2FjaW9uZXMtOWY3NTMu",
"ZmlyZWJhc2VhcHAuY29tIiwgImRhdGFiYXNlVVJM",
"IjogImh0dHBzOi8vY2FsaWZpY2FjaW9uZXMtOWY3",
"NTMtZGVmYXVsdC1ydGRiLmZpcmViYXNlaW8uY29t",
"IiwgInByb2plY3RJZCI6ICJjYWxpZmljYWNpb25l",
"cy05Zjc1MyIsICJzdG9yYWdlQnVja2V0IjogImNh",
"bGlmaWNhY2lvbmVzLTlmNzUzLmZpcmViYXNlc3Rv",
"cmFnZS5hcHAiLCAibWVzc2FnaW5nU2VuZGVySWQi",
"OiAiOTA3MDA4MDA1NzM3IiwgImFwcElkIjogIjE6",
"OTA3MDA4MDA1NzM3OndlYjozMDY5OTk4YjBiYWQ4",
"ODNjYzU3NGY4In0="];
function getCfg(){ try{ return JSON.parse(atob(_PARTS.join(''))); }catch(e){ return null; } }
var data=[]; try{ data=JSON.parse(localStorage.getItem('reg_local')||'[]'); }catch(e){ data=[]; }
var filtro='all', editId=null, rtdb=null, firebaseOn=false, _guardando=false;

function setF(f){ filtro=f; render(); }
function openM(id){
  editId=id||null; var m=el('modal'); if(!m) return; m.style.display='block'; if(m.classList) m.classList.add('open');
  if(el('mtitle')) el('mtitle').textContent=id?'Editar registro':'Nuevo registro';
  if(id){ var r=null; for(var i=0;i<data.length;i++) if(data[i].id==id) r=data[i];
    if(r){ el('nombre').value=r.nombre||''; el('telefono').value=r.telefono||''; el('direccion').value=r.direccion||''; el('notas').value=r.notas||'';
      var p=el('prevP'); if(p){ if(r.fotoP){p.src=r.fotoP;p.style.display='block';} p.dataset.url=r.fotoP||''; }
      var d=el('prevD'); if(d){ if(r.fotoD){d.src=r.fotoD;d.style.display='block';} d.dataset.url=r.fotoD||''; }
    }
  } else { el('nombre').value=''; el('telefono').value=''; el('direccion').value=''; el('notas').value='';
    var p2=el('prevP'); if(p2){p2.style.display='none';p2.dataset.url='';} var d2=el('prevD'); if(d2){d2.style.display='none';d2.dataset.url='';}
  }
}
function closeM(){ var m=el('modal'); if(m){ m.style.display='none'; if(m.classList) m.classList.remove('open'); } }
function callNum(t){ location.href='tel:'+t; }
function editReg(id){ openM(id); }
function delReg(id){
  if(!confirm('¿Borrar?')) return;
  if(rtdb) rtdb.ref('registros/'+id).remove().catch(function(e){ log('Error borrar RTDB: '+e.message); });
  data=data.filter(function(x){return x.id!=id;}); try{localStorage.setItem('reg_local',JSON.stringify(data));}catch(e){} render();
}
function render(){
  var c=el('count'); if(c) c.textContent=data.length+' registros'+(firebaseOn?' (Firebase Realtime)':' (celular)');
  var list=el('list'); if(!list) return; list.innerHTML='';
  var q=val('q').toLowerCase();
  var f=data.filter(function(r){
    if(!q) return true;
    if(filtro=='nombre') return (r.nombre||'').toLowerCase().indexOf(q)>-1;
    if(filtro=='telefono') return (r.telefono||'').indexOf(q)>-1;
    if(filtro=='direccion') return (r.direccion||'').toLowerCase().indexOf(q)>-1;
    return ((r.nombre||'')+(r.telefono||'')+(r.direccion||'')).toLowerCase().indexOf(q)>-1;
  });
  if(!f.length){ list.innerHTML='<div class="card" style="text-align:center">Aún no hay registros<br><button class="btnBlue" type="button" onclick="openM()">Agregar primer registro</button></div>'; return; }
  f.forEach(function(r){
    var d=document.createElement('div'); d.className='persona';
    var fotoP=r.fotoP?'<img src="'+r.fotoP+'">':'<div style="width:64px;height:64px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center">👤</div>';
    var fotoD=r.fotoD?'<img class="dom" src="'+r.fotoD+'">':'';
    d.innerHTML='<div>'+fotoP+fotoD+'</div><div style="flex:1"><b>'+(r.nombre||'')+'</b><span class="small" style="display:block">'+(r.telefono||'')+'<br>'+(r.direccion||'')+'<br>'+(r.notas||'')+'</span><div style="display:flex;gap:6px;margin-top:6px"><button class="btnGray" style="width:auto;padding:9px" type="button" onclick="callNum(\''+(r.telefono||'')+'\')">📞 Llamar</button><button class="btnGray" style="width:auto;padding:9px" type="button" onclick="editReg(\''+r.id+'\')">✏️ Editar</button><button class="btnGray" style="width:auto;padding:9px" type="button" onclick="delReg(\''+r.id+'\')">🗑️ Borrar</button></div></div>';
    list.appendChild(d);
  });
}
function readFile(input,cb){ var f=input.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(e){cb(e.target.result);}; r.readAsDataURL(f); }
function bindPhoto(inp,prev){ var i=el(inp); if(!i) return; i.addEventListener('change',function(){ readFile(this,function(u){ var p=el(prev); if(p){p.src=u;p.style.display='block';p.dataset.url=u;} }); }); }

function probar(){
  log('--- PROBANDO ---');
  if(!rtdb){ log('❌ Realtime NO conectado. Revisa internet y reglas.'); return; }
  log('Intentando escribir /registros/PRUEBA ...');
  rtdb.ref('registros/PRUEBA').set({nombre:'PRUEBA',telefono:'000',direccion:'prueba',notas:'borrame',creadoEn:Date.now()}).then(function(){
    log('✅ SÍ GUARDÓ EN FIREBASE! Ve a Realtime Database > registros > PRUEBA');
    alert('✅ SÍ GUARDÓ! Ve a Realtime Database y busca registros > PRUEBA');
  }).catch(function(e){
    log('❌ ERROR: '+e.message+' | código: '+e.code);
    if(e.code=='PERMISSION_DENIED' || e.message.indexOf('Permission')>-1){
      log('→ Tus reglas están en DENEGAR. Ve a Realtime Database > Reglas y pon: { "rules": { ".read": true, ".write": true } } y Publicar');
      alert('Error: PERMISSION_DENIED. Tienes que poner las reglas en true. Ve a Realtime Database > Reglas.');
    } else { alert('Error: '+e.message); }
  });
}

function save(){
  if(_guardando) return; _guardando=true;
  var btn=el('btnGuardar');
  try{
    if(btn){btn.disabled=true;btn.textContent='⏳ GUARDANDO...';}
    var nombre=val('nombre'), telefono=val('telefono'), direccion=val('direccion'), notas=val('notas');
    if(!nombre||!telefono||!direccion){ alert('Falta nombre, teléfono o dirección'); if(btn){btn.disabled=false;btn.textContent='✅ GUARDAR REGISTRO';} _guardando=false; return; }
    // FOTOS: en Realtime NO caben fotos grandes, así que guardamos SIN foto en Firebase y CON foto solo en celular.
    // Si quieres foto en nube, hay que usar Storage, pero eso es lo que fallaba. Primero que guarde el texto.
    var p=el('prevP'), d=el('prevD');
    var fotoP=(p&&p.dataset)?(p.dataset.url||''):'';
    var fotoD=(d&&d.dataset)?(d.dataset.url||''):'';
    var id=editId||Date.now().toString();
    var rec={id:id,nombre:nombre,telefono:telefono,direccion:direccion,notas:notas,fotoP:fotoP,fotoD:fotoD};
    // 1. Guardar local
    if(editId){ data=data.map(function(x){return x.id==editId?rec:x;}); } else { data.unshift(rec); }
    try{ localStorage.setItem('reg_local',JSON.stringify(data)); }catch(e){}
    render(); closeM();
    if(btn){btn.disabled=false;btn.textContent='✅ GUARDAR REGISTRO';} _guardando=false;
    alert('Guardado en celular ✅ Ahora subiendo a Firebase...');
    // 2. Subir a Realtime SOLO texto (sin foto, para que no falle por tamaño)
    if(rtdb){
      log('Subiendo '+nombre+' a /registros/'+id+' ...');
      rtdb.ref('registros/'+id).set({nombre:nombre,telefono:telefono,direccion:direccion,notas:notas,creadoEn:Date.now()}).then(function(){
        log('✅ Guardado en Firebase Realtime: /registros/'+id);
        var s=el('status'); if(s) s.textContent='● CONECTADO - Último guardado en Firebase ✅';
      }).catch(function(e){
        log('❌ NO pasó a Firebase: '+e.message+' código: '+e.code);
        if(e.code=='PERMISSION_DENIED' || e.message.indexOf('Permission')>-1){
          alert('Guardado en celular ✅ pero Firebase lo rechazó: PERMISSION_DENIED.\n\nVe a Realtime Database > Reglas y pon:\n{ "rules": { ".read": true, ".write": true } }\nY dale Publicar. Luego dale a PROBAR.');
        } else { alert('No pasó a Firebase: '+e.message); }
      });
    } else { log('❌ Realtime no conectado, solo quedó en celular'); }
  }catch(e){ alert('Error: '+e.message); log('Error save: '+e.message); if(btn){btn.disabled=false;btn.textContent='✅ GUARDAR REGISTRO';} _guardando=false; }
}

function init(){
  try{
    if(typeof firebase==='undefined'){ var s=el('status'); if(s) s.textContent='● Sin internet para Firebase'; log('SDK no cargó (sin internet)'); return; }
    var cfg=getCfg(); if(!firebase.apps.length) firebase.initializeApp(cfg);
    rtdb=firebase.database(); firebaseOn=true;
    var st=el('status'); if(st) st.textContent='● CONECTADO A REALTIME DATABASE';
    log('Conectado a Realtime ✅ Escuchando /registros ...');
    rtdb.ref('registros').on('value', function(snap){
      var obj=snap.val()||{};
      var fromCloud=Object.keys(obj).map(function(k){ var o=obj[k]; o.id=k; return o; });
      // Fusionar: nube + local que no está en nube
      var byId={}; var merged=[];
      fromCloud.forEach(function(r){ if(!byId[r.id]){byId[r.id]=1;merged.push(r);} });
      var localCopy=[]; try{localCopy=JSON.parse(localStorage.getItem('reg_local')||'[]');}catch(e){}
      localCopy.forEach(function(r){ if(!byId[r.id]){byId[r.id]=1;merged.push(r);} });
      // Si la nube trae un registro sin foto, conservar la foto local si existe
      merged.forEach(function(r){ var loc=null; for(var i=0;i<localCopy.length;i++) if(localCopy[i].id==r.id) loc=localCopy[i]; if(loc){ if(!r.fotoP) r.fotoP=loc.fotoP||''; if(!r.fotoD) r.fotoD=loc.fotoD||''; } });
      data=merged; try{localStorage.setItem('reg_local',JSON.stringify(data));}catch(e){} render();
      log('Sincronizado desde Firebase: '+merged.length+' registros');
    }, function(e){ log('Error al leer: '+e.message); });
  }catch(e){ log('Error init: '+e.message); }
}
document.addEventListener('DOMContentLoaded', function(){
  var b1=el('btnNuevoTop'); if(b1) b1.addEventListener('click', function(){openM();});
  var b2=el('fab'); if(b2) b2.addEventListener('click', function(){openM();});
  var bg=el('btnGuardar'); if(bg) bg.addEventListener('click', function(e){e.preventDefault();save();});
  var q=el('q'); if(q) q.addEventListener('input', render);
  bindPhoto('fileP','prevP'); bindPhoto('filePcam','prevP'); bindPhoto('fileD','prevD'); bindPhoto('fileDcam','prevD');
  render(); init();
});
</script>
</body></html>
